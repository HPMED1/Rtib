[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtib"
version = "0.0.1"
description = "Local-first AI sorter/formatter for messy unstructured text"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Rtib dev", email = "nerohpmed@gmail.com" }]
keywords = ["llm", "ollama", "structured-output", "data-cleaning", "etl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.6",
    "ruff>=0.5",
]

[project.scripts]
rtib = "rtib.cli:main"

[project.gui-scripts]
rtib-gui = "rtib.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtib = ["resources/icons/*", "resources/styles/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
